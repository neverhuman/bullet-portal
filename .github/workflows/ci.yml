name: ci

# Thin workflow. Every job delegates to ops/ci/<lane>.sh so local runs
# (scripts/ci-local.sh <lane>, just <lane>) and hosted CI execute the same
# commands. Required builds the exact sibling farmd and runs mocked plus real
# Playwright; missing family provisioning fails closed. Hosted security provisions checksum-pinned gitleaks.
# Jankurai remains a fail-closed local/release gate and is not registered here
# until a portable pinned distribution exists. Every third-party action is
# pinned to a full 40-character commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast-lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Deterministic fast lane
        run: bash ops/ci/fast.sh

  required:
    name: required-lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fast
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Required (fast + mocked and real farmd browser proof)
        run: bash ops/ci/required.sh

  contract:
    name: contract-lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: required
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Contract (mocked API)
        run: bash ops/ci/contract.sh

  security:
    name: security-lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Install gitleaks 8.21.2
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          tools="$RUNNER_TEMP/bullet-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$tools"
          tar -xzf "$archive" -C "$tools" gitleaks
          printf '%s\n' "$tools" >> "$GITHUB_PATH"
      - name: Security (gitleaks + npm audit)
        run: bash ops/ci/security.sh
