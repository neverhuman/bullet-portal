name: CI

on:
  pull_request:
  push:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: CI / fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      observation: ${{ steps.observe.outputs.present }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Scan source and lockfiles before installation
        run: node ops/ci/preinstall-scan.mjs
      - name: Pin npm
        run: |
          npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fast lane
        id: lane
        run: |
          set +e
          bash scripts/ci-local.sh fast
          status=$?
          printf 'exit_code=%s\n' "$status" >>"$GITHUB_OUTPUT"
          exit "$status"
      - name: Emit unsigned observation
        id: observe
        if: ${{ always() }}
        env:
          LANE_OUTCOME: ${{ steps.lane.outcome }}
          LANE_EXIT_CODE: ${{ steps.lane.outputs.exit_code }}
        run: bash scripts/ci-observation.sh fast "$LANE_OUTCOME" "${LANE_EXIT_CODE:-1}"
      - name: Sanitize diagnostics
        id: sanitize
        if: ${{ always() }}
        run: node ops/ci/sanitize-artifacts.mjs fast
      - name: Upload sanitized diagnostics
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-${{ github.run_id }}-${{ github.run_attempt }}-fast
          path: target/ci-upload/fast/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  lint:
    name: CI / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      observation: ${{ steps.observe.outputs.present }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Scan source and lockfiles before installation
        run: node ops/ci/preinstall-scan.mjs
      - name: Pin npm
        run: |
          npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: actionlint@1.7.8
          fallback: none
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: shellcheck@0.10.0
          fallback: none
      - name: Lint lane
        id: lane
        run: |
          set +e
          bash scripts/ci-local.sh lint
          status=$?
          printf 'exit_code=%s\n' "$status" >>"$GITHUB_OUTPUT"
          exit "$status"
      - name: Emit unsigned observation
        id: observe
        if: ${{ always() }}
        env:
          LANE_OUTCOME: ${{ steps.lane.outcome }}
          LANE_EXIT_CODE: ${{ steps.lane.outputs.exit_code }}
        run: bash scripts/ci-observation.sh lint "$LANE_OUTCOME" "${LANE_EXIT_CODE:-1}"
      - name: Sanitize diagnostics
        id: sanitize
        if: ${{ always() }}
        run: node ops/ci/sanitize-artifacts.mjs lint
      - name: Upload sanitized diagnostics
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-${{ github.run_id }}-${{ github.run_attempt }}-lint
          path: target/ci-upload/lint/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  contract:
    name: CI / contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      observation: ${{ steps.observe.outputs.present }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Scan source and lockfiles before installation
        run: node ops/ci/preinstall-scan.mjs
      - name: Pin npm
        run: |
          npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install reviewed Playwright browser lifecycle
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Contract lane
        id: lane
        run: |
          set +e
          bash scripts/ci-local.sh contract
          status=$?
          printf 'exit_code=%s\n' "$status" >>"$GITHUB_OUTPUT"
          exit "$status"
      - name: Emit unsigned observation
        id: observe
        if: ${{ always() }}
        env:
          LANE_OUTCOME: ${{ steps.lane.outcome }}
          LANE_EXIT_CODE: ${{ steps.lane.outputs.exit_code }}
        run: bash scripts/ci-observation.sh contract "$LANE_OUTCOME" "${LANE_EXIT_CODE:-1}"
      - name: Sanitize diagnostics
        id: sanitize
        if: ${{ always() }}
        run: node ops/ci/sanitize-artifacts.mjs contract
      - name: Upload sanitized diagnostics
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-${{ github.run_id }}-${{ github.run_attempt }}-contract
          path: target/ci-upload/contract/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  security:
    name: CI / security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      observation: ${{ steps.observe.outputs.present }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Scan source and lockfiles before installation
        run: node ops/ci/preinstall-scan.mjs
      - name: Install gitleaks 8.21.2 from checksum-pinned archive
        run: bash ops/ci/install-gitleaks.sh
      - name: Pin npm
        run: |
          npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: zizmor@1.25.2
          fallback: none
      - name: Security lane
        id: lane
        run: |
          set +e
          bash scripts/ci-local.sh security
          status=$?
          printf 'exit_code=%s\n' "$status" >>"$GITHUB_OUTPUT"
          exit "$status"
      - name: Emit unsigned observation
        id: observe
        if: ${{ always() }}
        env:
          LANE_OUTCOME: ${{ steps.lane.outcome }}
          LANE_EXIT_CODE: ${{ steps.lane.outputs.exit_code }}
        run: bash scripts/ci-observation.sh security "$LANE_OUTCOME" "${LANE_EXIT_CODE:-1}"
      - name: Sanitize diagnostics
        id: sanitize
        if: ${{ always() }}
        run: node ops/ci/sanitize-artifacts.mjs security
      - name: Upload sanitized diagnostics
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-${{ github.run_id }}-${{ github.run_attempt }}-security
          path: target/ci-upload/security/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  docs:
    name: CI / docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      observation: ${{ steps.observe.outputs.present }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Scan source and lockfiles before installation
        run: node ops/ci/preinstall-scan.mjs
      - name: Pin npm
        run: |
          npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Docs lane
        id: lane
        run: |
          set +e
          bash scripts/ci-local.sh docs
          status=$?
          printf 'exit_code=%s\n' "$status" >>"$GITHUB_OUTPUT"
          exit "$status"
      - name: Emit unsigned observation
        id: observe
        if: ${{ always() }}
        env:
          LANE_OUTCOME: ${{ steps.lane.outcome }}
          LANE_EXIT_CODE: ${{ steps.lane.outputs.exit_code }}
        run: bash scripts/ci-observation.sh docs "$LANE_OUTCOME" "${LANE_EXIT_CODE:-1}"
      - name: Sanitize diagnostics
        id: sanitize
        if: ${{ always() }}
        run: node ops/ci/sanitize-artifacts.mjs docs
      - name: Upload sanitized diagnostics
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-${{ github.run_id }}-${{ github.run_attempt }}-docs
          path: target/ci-upload/docs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  required:
    name: required
    if: ${{ always() }}
    needs: [fast, lint, contract, security, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
      - name: Download exact-run observations and sanitized artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: portal-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci-artifacts/atomic
          merge-multiple: true
      - name: Converge required jobs
        if: ${{ always() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node ops/ci/aggregate.mjs .ci-artifacts/atomic "$EXPECTED_COMMIT"
