name: ci

# Thin workflow. Every job delegates to ops/ci/<lane>.sh so local runs
# (scripts/ci-local.sh <lane>, just <lane>) and hosted CI execute the same
# commands. Portal only: never compiles Rust; Playwright is the contract lane,
# not the required lane. Runners must provide gitleaks and jankurai; a missing
# tool fails the lane instead of skipping. Every third-party action is pinned
# to a full 40-character commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast-lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Deterministic fast lane
        run: bash ops/ci/fast.sh

  required:
    name: required-lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fast
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Required (tsc + vitest + build)
        run: bash ops/ci/required.sh

  contract:
    name: contract-lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: required
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Contract (mocked API)
        run: bash ops/ci/contract.sh

  security:
    name: security-lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Security (gitleaks + npm audit)
        run: bash ops/ci/security.sh

  audit:
    name: jankurai-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit (ratcheted floor)
        run: bash ops/ci/audit.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-score
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
